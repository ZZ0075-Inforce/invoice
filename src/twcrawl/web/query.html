<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>twcrawl 查詢頁</title>
<script src="ui.js"></script>
<link rel="stylesheet" href="ui.css">
<style>
  body {
    background: var(--page); color: var(--text-1);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
    font-size: 14px; line-height: 1.5; padding: 24px 16px 48px;
  }

  header { margin-bottom: 16px; position: relative; }
  button.theme { position: absolute; top: 0; right: 0;
                 border: 1px solid var(--border); background: var(--surface-1);
                 color: var(--text-2); border-radius: 999px; padding: 3px 12px;
                 cursor: pointer; font: inherit; font-size: 12px; }
  h1 { font-size: 20px; font-weight: 650; }

  .tile .value { font-size: 24px; font-weight: 600; margin-top: 2px; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip {
    border: 1px solid var(--border); background: var(--surface-1);
    color: var(--text-2); border-radius: 999px; padding: 4px 14px;
    font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .chip.on { border-color: var(--s1); color: var(--s1); font-weight: 650; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
             font-size: 12.5px; color: var(--text-2); }
  .filters label { display: inline-flex; gap: 5px; align-items: center; }
  .filters input, .filters select {
    border: 1px solid var(--border); background: var(--surface-1);
    color: var(--text-1); border-radius: 6px; padding: 3px 8px; font: inherit;
  }
  .filters input[type="search"] { width: 220px; }
  .filters input[type="number"] { width: 90px; }
  .stat { color: var(--muted); font-size: 12.5px; margin: 10px 0 6px; }

  td { border-bottom: 1px solid var(--grid); padding: 5px 10px 5px 0;
       vertical-align: top; }

  tr.inv { cursor: pointer; }
  tr.inv:hover td { background: color-mix(in srgb, var(--grid) 35%, transparent); }
  tr.items-row > td { padding: 0 0 10px 18px; border-bottom: 1px solid var(--grid); }
  tr.items-row table { font-size: 12.5px; width: auto; min-width: 60%; }
  tr.items-row td, tr.items-row th { border-bottom: 1px dashed var(--grid); }

  a.map, .linkish { color: var(--s1); text-decoration: none; font-size: inherit;
                    cursor: pointer; background: none; border: 0; padding: 0;
                    font-family: inherit; }
  a.fda-mark { text-decoration: none; font-size: 12px; }
  .lot-mark { font-size: 12px; cursor: help; }
  .st-mark { color: var(--muted); font-size: 11px; }
  a.map:hover, .linkish:hover { text-decoration: underline; }
  .more { margin-top: 10px; }
  #savebar { position: fixed; left: 50%; transform: translateX(-50%);
             bottom: 18px; z-index: 20; background: var(--surface-1);
             border: 1px solid var(--border); border-radius: 999px;
             padding: 8px 18px; box-shadow: 0 4px 16px rgba(0,0,0,0.18);
             font-size: 13px; }

  .ok   { color: var(--up-good); }
  .off  { color: var(--muted); }
  /* 價格時間線：svg 的共用規則是 width:100%，放進展開列會撐滿整頁 */
  .pchart { max-width: 620px; margin: 4px 0 10px; }
  svg { display: block; width: 100%; height: auto; }
  svg text { font-family: inherit; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">
  找不到資料（data.js）。<br><br>
  請開 <b><code>out\query.html</code></b>——<code>twcrawl export</code> 會把模板與
  data.js 一起放在那裡。
</div></div>
<script src="data.js"></script>
<script>
TW.page({
  needs: ["invoices"],
  render(D, ui) {
  const { css, nt, esc, el } = ui;
  const app = document.getElementById("app");
  const qty = v => v == null ? "—"
    : (Math.round(v * 100) / 100).toString().replace(/\.0+$/, "");

  // ---- 同頁雙模式（ADR-0002）：serve 可寫回，file:// 提供複製 -----------
  const SERVE = TW.isServe();
  async function saveRules(set, aliases) {
    try {
      const r = await fetch("/api/rules", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ set, aliases }),
      });
      const j = await r.json();
      if (!j.ok) console.error("寫回失敗：" + j.error);
      return !!j.ok;
    } catch (e) { console.error(e); return false; }
  }
  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); return true; }
    catch (_e) {
      const ta = document.createElement("textarea");
      ta.value = t; document.body.append(ta); ta.select();
      const ok = document.execCommand("copy"); ta.remove(); return ok;
    }
  }
  let savedN = 0;   // 存檔浮動提示：累計寫回筆數，提醒重新整理看重算結果
  function noteSaved(n) {
    savedN += n;
    let bar = document.getElementById("savebar");
    if (!bar) { bar = el("div"); bar.id = "savebar"; document.body.append(bar); }
    bar.innerHTML = `已寫回 ${savedN} 筆規則，資料已重生——` +
      '<button class="linkish" id="reloadbtn">重新整理看結果</button>';
    bar.querySelector("#reloadbtn")
      .addEventListener("click", () => location.reload());
  }

  const hasItems = D.invoices.some(v => Array.isArray(v.items));
  const meta = {};                       // display name → seller 靜態資訊
  for (const s of D.sellers || []) meta[s.name] = s;

  // FDA 命中對照：發票號碼 → 命中列（查詢頁在明細層級標 ⚠ 連食安頁）
  const matchesByNum = {};
  for (const m of (D.fda && D.fda.matches) || []) {
    if (m.num) (matchesByNum[m.num] ||= []).push(m);
  }
  function fdaMark(v) {
    const ms = matchesByNum[v.num];
    if (!ms) return "";
    const src = ms[0].source || "";
    const title = `FDA 命中 ${ms.length} 筆（` +
      [...new Set(ms.map(m => m.level))].join("、") +
      "）——命中≠買到問題商品，點看食安頁";
    return ` <a class="fda-mark" href="fda.html${
      src ? "?src=" + encodeURIComponent(src) : ""}" title="${esc(title)}">⚠</a>`;
  }
  // 對獎中獎對照：發票號碼 → 中獎資訊（列上標 🎉，滑過看獎別與領獎期限）
  const lotWinByNum = {};
  for (const p of (D.lottery && D.lottery.periods) || []) {
    for (const w of p.wins) lotWinByNum[w.num] = w;
  }
  function lotMark(v) {
    const w = lotWinByNum[v.num];
    return w ? ` <span class="lot-mark" title="${esc(
      `${w.prize} ${nt(w.prizeAmount)}（${w.periodLabel}，領獎至 ${w.claimEnd}）`
      + (w.also ? `；另符合${w.also}，擇高` : "")
    )}">🎉</span>` : "";
  }
  // 發票狀態（issue #14）：翻譯與「算不算常態」都在匯出端決定，這裡只讀
  // statusFlagged——拿譯文比對的話，改譯名會讓 431 列靜默全長出徽章。
  // 常態的「開立」不佔列上版面（展開明細看得到），非常態（作廢、未收錄
  // 碼）才在號碼旁標出來
  function stMark(v) {
    return v.statusFlagged && v.status
      ? ` <span class="st-mark" title="發票狀態">（${esc(v.status)}）</span>`
      : "";
  }
  const unnecessarySet = ui.unnecessaryCats(D.categories);
  const dates = D.invoices.map(v => v.date).sort();
  const minM = dates[0].slice(0, 7), maxM = dates[dates.length - 1].slice(0, 7);

  // ---- 版頭與視圖切換 ---------------------------------------------------
  const hd = el("header");
  hd.innerHTML = "<h1>twcrawl 查詢頁</h1>" +
    '<div class="sub"><a class="map" href="dashboard.html">← 回儀表板</a>　' +
    '<a class="map" href="fda.html">🛡 食安頁</a>　' +
    '<a class="map" href="map.html">🗺 消費地圖</a></div>';
  hd.append(ui.themeButton());
  app.append(hd);

  const VIEWS = [["list", "發票清單"], ["seller", "店家查詢"],
                 ["fixed", "固定支出"], ["price", "價格追蹤"]];
  const chips = el("div", "chips");
  for (const [key, label] of VIEWS) {
    const b = el("button", "chip", label);
    b.dataset.view = key;
    b.addEventListener("click", () => show(key));
    chips.append(b);
  }
  app.append(chips);
  const body = el("div");
  app.append(body);

  const foot = el("div", "note",
    `資料截至 ${esc(D.generatedAt || "")}・全部在本機運算、不外連（docs/adr/0002）・` +
    "品項與發票號碼只存在本機 data.js");
  app.append(foot);

  // ---- URL 深連結（雙向：讀進來，狀態變了也寫回去，F5 不歸零） ----------
  const P = new URLSearchParams(location.search);
  const initView = P.get("seller") ? "seller" : (P.get("view") || "list");
  function syncUrl(view) {
    try {   // file:// 下部分瀏覽器不允許 replaceState，失敗就靜默略過
      const qs = new URLSearchParams(P);
      if (view === "list") qs.delete("view"); else qs.set("view", view);
      if (view !== "seller") qs.delete("seller");
      const s = qs.toString();
      history.replaceState(null, "", location.pathname + (s ? "?" + s : ""));
    } catch (_e) {}
  }

  // ---- 發票清單視圖 -----------------------------------------------------
  let F;                                  // 篩選狀態（DOM 即狀態）
  function listView() {
    const card = el("div", "card");
    card.append(el("h2", null, "搜尋與篩選"));
    card.append(el("div", "desc",
      "關鍵字比對店家（含公司名）、品名、發票號碼、日期（如 2026-04-26）；" +
      "條件之間是 AND"));
    const f = el("div", "filters");
    f.innerHTML =
      `<input type="search" id="q" placeholder="店家／品名／發票號碼／日期">` +
      `<label>月份 <input type="month" id="from" min="${minM}" max="${maxM}"> ～ ` +
      `<input type="month" id="to" min="${minM}" max="${maxM}"></label>` +
      `<label>分類 <select id="cat"><option value="">全部</option>` +
      (D.categories || []).map(c =>
        `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join("") +
      `</select></label>` +
      `<label>金額 <input type="number" id="amin" placeholder="最低"> ～ ` +
      `<input type="number" id="amax" placeholder="最高"></label>` +
      `<label><input type="checkbox" id="unn"> 只看非必要</label>`;
    card.append(f);
    const stat = el("div", "stat");
    stat.style.display = "flex";
    stat.style.justifyContent = "space-between";
    stat.style.gap = "12px";
    const statTxt = el("span");
    const csvBtn = el("button", "linkish", "另存 CSV");
    csvBtn.title = "匯出目前篩選結果（UTF-8 BOM，Excel 可直開）";
    stat.append(statTxt, csvBtn);
    const wrapT = el("div", "scrollx");
    const more = el("div", "more");
    card.append(stat, wrapT, more);
    body.append(card);
    if (!hasItems) card.append(el("div", "note",
      "！data.js 是舊版（沒有品項）——重跑 twcrawl export 即補齊。"));

    F = { q: f.querySelector("#q"), from: f.querySelector("#from"),
          to: f.querySelector("#to"), cat: f.querySelector("#cat"),
          amin: f.querySelector("#amin"), amax: f.querySelector("#amax"),
          unn: f.querySelector("#unn") };
    F.q.value = P.get("q") || "";
    F.from.value = P.get("from") || "";
    F.to.value = P.get("to") || "";
    if (P.get("cat")) F.cat.value = P.get("cat");
    F.amin.value = P.get("amin") || "";
    F.amax.value = P.get("amax") || "";
    F.unn.checked = P.get("unnecessary") === "1";
    for (const k in F) F[k].addEventListener(
      F[k].type === "search" ? "input" : "change", renderList);

    let shown = 200;
    const sort = { key: "date", dir: -1 };   // 預設最新在前
    function filtered() {
      const q = F.q.value.trim().toLowerCase();
      const { from, to } = ui.monthBounds(F.from.value, F.to.value);
      const amin = F.amin.value === "" ? null : Number(F.amin.value);
      const amax = F.amax.value === "" ? null : Number(F.amax.value);
      return D.invoices.filter(v => {
        if (from && v.date < from) return false;
        if (to && v.date > to) return false;
        if (F.cat.value && v.category !== F.cat.value) return false;
        if (F.unn.checked && !unnecessarySet.has(v.category)) return false;
        if (amin != null && v.amount < amin) return false;
        if (amax != null && v.amount > amax) return false;
        if (q) {
          const m = meta[v.seller];
          const hay = [v.seller, m && m.legal, v.num, v.date,
            ...(v.items || []).map(i => i.desc)]
            .filter(Boolean).join("\n").toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }
    function renderList() {
      shown = 200;
      for (const [key, val] of [["q", F.q.value.trim()],
        ["from", F.from.value], ["to", F.to.value], ["cat", F.cat.value],
        ["amin", F.amin.value], ["amax", F.amax.value],
        ["unnecessary", F.unn.checked ? "1" : ""]]) {
        if (val) P.set(key, val); else P.delete(key);
      }
      syncUrl("list");
      paint();
    }
    function paint() {
      const rows = filtered().sort((a, b) => {
        const [va, vb] = sort.key === "amount"
          ? [a.amount, b.amount] : [a.date, b.date];
        return (va < vb ? -1 : va > vb ? 1 : 0) * sort.dir;
      });
      const sum = rows.reduce((s, v) => s + v.amount, 0);
      statTxt.textContent = `${rows.length} 張發票・${nt(sum)}` +
        (rows.length > shown ? `・先列前 ${shown} 張` : "");
      csvBtn.onclick = () => exportCsv(rows);
      const arrow = k => sort.key === k ? (sort.dir < 0 ? " ▼" : " ▲") : "";
      wrapT.innerHTML = "<table><tr>" +
        `<th class="sortable" data-k="date" title="點擊排序">日期${arrow("date")}</th>` +
        "<th>店家</th><th>分類</th>" +
        `<th class="num sortable" data-k="amount" title="點擊排序">金額${arrow("amount")}</th>` +
        "<th>發票號碼</th></tr>" +
        rows.slice(0, shown).map((v, i) =>
          `<tr class="inv" data-i="${i}"><td>${v.date}</td>` +
          `<td${(meta[v.seller] || {}).legal
            ? ` title="登記名：${esc(meta[v.seller].legal)}"` : ""}>${
            esc(v.seller || "（無店名）")}</td><td>${esc(v.category)}</td>` +
          `<td class="num">${Math.round(v.amount).toLocaleString("zh-TW")}</td>` +
          `<td>${esc(v.num || "—")}${stMark(v)}${fdaMark(v)}${lotMark(v)}</td></tr>`).join("") +
        "</table>";
      wrapT.querySelectorAll("th.sortable").forEach(th => {
        th.style.cursor = "pointer";
        th.addEventListener("click", () => {
          if (sort.key === th.dataset.k) sort.dir = -sort.dir;
          else { sort.key = th.dataset.k; sort.dir = -1; }
          paint();
        });
      });
      const visible = rows.slice(0, shown);
      wrapT.querySelectorAll("tr.inv").forEach(tr => {
        tr.addEventListener("click", evt => {
          if (evt.target.closest("a")) return;   // ⚠ 連結不觸發展開
          toggleItems(tr, visible[+tr.dataset.i]);
        });
      });
      more.innerHTML = "";
      if (rows.length > shown) {
        const b = el("button", "chip", `顯示更多（還有 ${rows.length - shown} 張）`);
        b.addEventListener("click", () => { shown += 200; paint(); });
        more.append(b);
      }
    }
    paint();
    if (!location.search) F.q.focus();   // 乾淨進頁時直接可打字搜尋
  }

  function exportCsv(rows) {
    // 一列一發票；品項以「、」串接。存進使用者下載夾（本機，使用者主動觸發）
    const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const lines = [["日期", "店家", "分類", "金額", "發票號碼", "品項"]
      .map(cell).join(",")];
    for (const v of rows) {
      lines.push([v.date, v.seller, v.category, Math.round(v.amount),
        v.num || "", (v.items || []).map(i => i.desc).filter(Boolean).join("、")]
        .map(cell).join(","));
    }
    const blob = new Blob([String.fromCharCode(0xFEFF) + lines.join("\r\n")],
      { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `twcrawl-查詢結果-${rows.length}筆.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function itemsTable(v) {
    const its = v.items || [];
    if (!its.length) return '<div class="note">（這張發票沒有品項明細）</div>';
    const ms = matchesByNum[v.num] || [];
    const itemHit = desc => desc && ms.some(m =>
      (m.level === "品項" || m.level === "警訊標題") &&
      typeof m.invoice === "string" && m.invoice.startsWith(desc));
    return "<table><tr><th>品名</th><th class=\"num\">數量</th>" +
      '<th class="num">單價</th><th class="num">金額</th></tr>' +
      its.map(i =>
        `<tr><td>${esc(i.desc ?? "—")}${itemHit(i.desc)
          ? ' <span title="此品項出現在 FDA 命中（命中≠買到問題商品）">⚠</span>'
          : ""}</td><td class="num">${qty(i.qty)}</td>` +
        `<td class="num">${i.price == null ? "—" : Math.round(i.price).toLocaleString("zh-TW")}</td>` +
        `<td class="num">${i.amount == null ? "—" : Math.round(i.amount).toLocaleString("zh-TW")}</td></tr>`
      ).join("") + "</table>";
  }
  function toggleItems(tr, v) {
    const next = tr.nextElementSibling;
    if (next && next.classList.contains("items-row")) { next.remove(); return; }
    const row = el("tr", "items-row");
    row.innerHTML = `<td colspan="5">${v.status
      ? `<div class="note">發票狀態：${esc(v.status)}</div>` : ""}${itemsTable(v)}</td>`;
    tr.after(row);
  }

  // ---- 店家查詢視圖 -----------------------------------------------------
  function sellerView() {
    const names = (D.sellers || []).map(s => s.name);
    const card = el("div", "card");
    card.append(el("h2", null, "店家查詢"));
    card.append(el("div", "desc",
      "可先選分類縮小範圍（不挑店家＝看整個分類的趨勢與店家排行），再挑店看明細"));
    const f = el("div", "filters");
    f.innerHTML = `<label>分類 <select id="scat">` +
      `<option value="">全部</option>` +
      (D.categories || []).map(c =>
        `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join("") +
      `</select></label>` +
      `<input type="search" id="sq" list="sellers" ` +
      `placeholder="輸入或挑選店家（依全期金額排序）">` +
      `<datalist id="sellers"></datalist>` +
      `<datalist id="cats">` +
      (D.categories || []).filter(c => c.name !== "未分類")
        .map(c => `<option value="${esc(c.name)}">`).join("") + `</datalist>`;
    card.append(f);
    const out = el("div");
    card.append(out);
    body.append(card);

    const input = f.querySelector("#sq");
    const catSel = f.querySelector("#scat");
    const dl = f.querySelector("#sellers");
    // 從發票聚合而非 sellers[].category：品項覆寫後一家店可跨分類
    // （好市多加油發票歸加油），排行、下拉、趨勢才會與磚的金額一致
    const sellersIn = cat => {
      const by = new Map();
      for (const v of D.invoices || []) {
        if (cat && v.category !== cat) continue;
        let b = by.get(v.seller);
        if (!b) by.set(v.seller, b = { name: v.seller, total: 0, count: 0 });
        b.total += v.amount;
        b.count += 1;
      }
      return [...by.values()].sort((a, b) => b.total - a.total);
    };
    function fillDatalist() {          // 下拉附登記名，設過招牌名也認得出
      dl.innerHTML = sellersIn(catSel.value).map(s =>
        `<option value="${esc(s.name)}">${(meta[s.name] || {}).legal
          ? esc(meta[s.name].legal) : ""}</option>`
      ).join("");
    }
    fillDatalist();

    catSel.addEventListener("change", () => {
      fillDatalist();
      if (catSel.value && input.value &&
          !sellersIn(catSel.value).some(s => s.name === input.value))
        input.value = "";
      if (input.value) renderSeller(input.value);
      else renderCategory(catSel.value);
    });
    input.addEventListener("change", () => renderSeller(input.value));
    const want = P.get("seller");
    const wantCat = P.get("cat");
    if (want && names.includes(want)) { input.value = want; renderSeller(want); }
    else if (want) out.append(el("div", "note", `找不到店家「${esc(want)}」。`));
    else if (wantCat && (D.categories || []).some(c => c.name === wantCat)) {
      catSel.value = wantCat;
      fillDatalist();
      renderCategory(wantCat);
    }

    function renderCategory(cat) {
      out.innerHTML = "";
      P.delete("seller");
      if (cat) P.set("cat", cat); else P.delete("cat");
      syncUrl("seller");

    function renderSeller(name) {

      const invs = D.invoices.filter(v => v.seller === name);
      const infoBits = [
        m.legal && `公司名 ${esc(m.legal)}`,

      assign.querySelector("#cat-btn").addEventListener("click", async () => {

      lt.querySelectorAll("tr.inv").forEach(tr => {

  function monthBars(months) {
    const W = 1000, H = 170, mT = 20, mB = 24, mL = 58, mR = 8;
    const iw = W - mL - mR, ih = H - mT - mB;
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const max = Math.max(1, ...months.map(m => m.v));
    const years = new Set(months.map(m => m.month.slice(0, 4)));
    const lab = m => years.size > 1
      ? m.month.slice(2, 4) + "/" + m.month.slice(5)
      : Number(m.month.slice(5)) + "月";
    const y = v => mT + ih - v / max * ih;
    const base = document.createElementNS("http://www.w3.org/2000/svg", "line");
    for (const [attr, val] of Object.entries({ x1: mL, x2: W - mR, y1: y(0), y2: y(0),
      stroke: css("--baseline"), "stroke-width": 1 })) base.setAttribute(attr, val);
    svg.append(base);
    const band = iw / months.length, bw = Math.min(24, band * 0.55);
    months.forEach((m, i) => {
      const cx = mL + band * (i + 0.5);
      if (m.v > 0) {
        const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        for (const [attr, val] of Object.entries({
          x: cx - bw / 2, y: y(m.v), width: bw, height: Math.max(y(0) - y(m.v), 1),
          rx: 3, fill: css("--s1") })) r.setAttribute(attr, val);
        svg.append(r);
        const cap = document.createElementNS("http://www.w3.org/2000/svg", "text");
        for (const [attr, val] of Object.entries({ x: cx, y: y(m.v) - 5,
          "text-anchor": "middle", "font-size": 10.5, fill: css("--text-2") }))
          cap.setAttribute(attr, val);
        cap.textContent = Math.round(m.v).toLocaleString("zh-TW");
        svg.append(cap);
      }
      const xl = document.createElementNS("http://www.w3.org/2000/svg", "text");
      for (const [attr, val] of Object.entries({ x: cx, y: H - 6,
        "text-anchor": "middle", "font-size": 11, fill: css("--muted") }))
        xl.setAttribute(attr, val);
      xl.textContent = lab(m);
      svg.append(xl);
    });
    return svg;
  }

  // ---- 固定支出視圖 -----------------------------------------------------
  // 偵測與期別標籤都在 export.py 的 _detect_fixed（月報磚與本視圖共用），
  // 這裡只呈現；門檻數字也由 payload 帶過來，改了門檻文案自動跟著改
  function fixedView() {
    const R = D.fixedRule || {};
    const card = el("div", "card");
    card.append(el("h2", null, "固定支出"));
    card.append(el("div", "desc",
      `同一店家、金額相近（±${R.tolAbs} 元或 ${R.tolPct}%）、` +
      `週期 ${R.minDays}–${R.maxDays} 天（月級以上，含雙月、年繳）、` +
      `且至少出現 ${R.minCount} 次。` +
      "偵測是提示，不代表存在契約；高頻日常（如手搖飲）依定義不列入。"));
    const found = Array.isArray(D.fixed) ? D.fixed : [];
    if (!found.length) {
      card.append(el("div", "note", "沒有偵測到固定支出（或資料月份還不夠長）。"));
      body.append(card);
      return;
    }
    const act = found.filter(x => x.active);
    const tiles = el("div", "tiles");
    for (const [label, value, extra] of [
      ["每月固定燒", nt(act.reduce((s, x) => s + x.monthly, 0)),
       "進行中項目的月化合計"],
      ["進行中", act.length + " 項", ""],
      ["疑似已停", (found.length - act.length) + " 項",
       `超過 ${R.staleFactor} 個週期沒再出現`],
    ]) {
      const t = el("div", "tile");
      t.append(el("div", "label", label), el("div", "value", value));
      if (extra) t.append(el("div", "delta", extra));
      tiles.append(t);
    }
    card.append(tiles);
    const wrapT = el("div", "scrollx");
    wrapT.innerHTML = "<table><tr><th>店家</th><th class=\"num\">單筆金額</th>" +
      "<th>週期</th><th class=\"num\">次數</th><th>首次</th><th>最近</th>" +
      "<th>下次預估</th><th>狀態</th><th class=\"num\">月化金額</th></tr>" +
      found.map(x =>
        `<tr><td><button class="linkish" data-s="${esc(x.seller)}">${esc(x.seller)}</button></td>` +
        `<td class="num">${Math.round(x.amount).toLocaleString("zh-TW")}</td>` +
        `<td>${esc(x.periodLabel)}</td><td class="num">${x.n}</td>` +
        `<td>${x.first}</td><td>${x.last}</td>` +
        `<td>${x.next || "—"}</td>` +
        `<td class="${x.active ? "ok" : "off"}">${x.active ? "進行中" : "疑似已停"}</td>` +
        `<td class="num">${Math.round(x.monthly).toLocaleString("zh-TW")}</td></tr>`
      ).join("") + "</table>";
    wrapT.querySelectorAll("button.linkish").forEach(b => {
      b.addEventListener("click", () => {
        P.set("seller", b.dataset.s);
        show("seller");
      });
    });
    card.append(wrapT);
    body.append(card);
  }

  // ---- 價格追蹤視圖 -----------------------------------------------------
  // 配對、三道清理與漲價判定全在 export.py 的 _detect_price，這裡只排版；
  // 門檻數字由 payload 帶過來（同 fixedRule），改了門檻文案自動跟著改。
  const SVGNS = "http://www.w3.org/2000/svg";
  const CHART_MIN_POINTS = 3;   // 兩點的折線是一條直線，畫出來只是假裝有趨勢
  const pmoney = v => v == null ? "—"
    : (Math.round(v * 100) / 100).toLocaleString("zh-TW");

  function priceLine(pts) {
    const W = 900, H = 150, mT = 14, mB = 26, mL = 56, mR = 14;
    const iw = W - mL - mR, ih = H - mT - mB;
    const mk = (tag, attrs) => {
      const e = document.createElementNS(SVGNS, tag);
      for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
      return e;
    };
    const svg = mk("svg", { viewBox: `0 0 ${W} ${H}` });
    const vals = pts.map(p => p.price);
    const lo = Math.min(...vals), hi = Math.max(...vals);
    // 一格一個品項，y 刻度各自獨立（同分類趨勢圖的理由）；全平的序列也要
    // 有高度可畫，否則 (v-y0)/(y1-y0) 會是 0/0
    const pad = (hi - lo) || Math.max(1, hi * 0.08);
    const y0 = lo - pad * 0.25, y1 = hi + pad * 0.25;
    const x = i => mL + (pts.length > 1 ? iw * i / (pts.length - 1) : iw / 2);
    const y = v => mT + ih - (v - y0) / (y1 - y0) * ih;
    for (const v of (hi === lo ? [hi] : [lo, hi])) {
      svg.append(mk("line", { x1: mL, x2: W - mR, y1: y(v), y2: y(v),
        stroke: css("--grid"), "stroke-width": 1 }));
      const t = mk("text", { x: mL - 8, y: y(v) + 4, "text-anchor": "end",
        "font-size": 11, fill: css("--muted") });
      t.textContent = pmoney(v);
      svg.append(t);
    }
    svg.append(mk("polyline", {
      points: pts.map((p, i) => `${x(i)},${y(p.price)}`).join(" "),
      fill: "none", stroke: css("--s1"), "stroke-width": 2 }));
    pts.forEach((p, i) => {
      const c = mk("circle", { cx: x(i), cy: y(p.price), r: 3.5,
        fill: css("--s1") });
      const ti = document.createElementNS(SVGNS, "title");
      ti.textContent = `${p.date}　${nt(p.price)}`;   // textContent：品名以外一律不進標記
      c.append(ti);
      svg.append(c);
    });
    for (const [i, anchor] of [[0, "start"], [pts.length - 1, "end"]]) {
      const t = mk("text", { x: x(i), y: H - 7, "text-anchor": anchor,
        "font-size": 11, fill: css("--muted") });
      t.textContent = pts[i].date.slice(5);
      svg.append(t);
    }
    return svg;
  }

  function pointsTable(p) {
    return "<table><tr><th>日期</th><th class=\"num\">單價</th>" +
      "<th>發票號碼</th></tr>" +
      p.points.map((pt, i) => {
        const prev = i ? p.points[i - 1].price : null;
        const mark = prev == null || pt.price === prev ? ""
          : pt.price > prev ? " ↑" : " ↓";
        return `<tr><td>${pt.date}</td>` +
          `<td class="num">${pmoney(pt.price)}${mark}</td><td>` +
          (pt.num
            ? `<button class="linkish pinv" data-n="${esc(pt.num)}">${esc(pt.num)}</button>`
            : "—") +
          "</td></tr>";
      }).join("") + "</table>";
  }

  function togglePoints(tr, p, cols) {
    const next = tr.nextElementSibling;
    if (next && next.classList.contains("items-row")) { next.remove(); return; }
    const row = el("tr", "items-row");
    const cell = el("td");
    cell.colSpan = cols;
    if (p.n >= CHART_MIN_POINTS) {
      const box = el("div", "pchart");
      box.append(priceLine(p.points));
      cell.append(box);
    }
    const tb = el("div", null, pointsTable(p));
    cell.append(tb);
    tb.querySelectorAll("button.pinv").forEach(b => {
      b.addEventListener("click", () => {
        P.set("q", b.dataset.n);      // 發票號碼進關鍵字＝清單只剩那一張
        P.delete("cat");
        show("list");
      });
    });
    row.append(cell);
    tr.after(row);
  }

  function priceView() {
    const R = D.priceRule || {};
    const PR = D.price || {};
    const pairs = Array.isArray(PR.pairs) ? PR.pairs : [];
    const S = PR.stats || {};
    const card = el("div", "card");
    card.append(el("h2", null, "價格追蹤"));
    card.append(el("div", "desc",
      `同一家店、品名完全相同、至少 ${R.minPoints} 個不同購買日就會被追蹤；` +
      `「漲價」＝最近一次單價高於先前價格的中位數 ${R.risePct}% 以上。` +
      "不跨店比價——不同店的同名商品未必是同一件東西。"));
    if (!pairs.length) {
      card.append(el("div", "note",
        "還沒有可追蹤的品項——同一家店的同一個品名要買過兩次以上才比得出價格。"));
      body.append(card);
      return;
    }
    const tiles = el("div", "tiles");
    for (const [label, value, extra] of [
      ["可追蹤品項", S.pairs + " 項", `同店同品名、${R.minPoints} 個購買日以上`],
      ["偵測到漲價", S.risen + " 項", `最近一次高於先前中位數 ${R.risePct}% 以上`],
      ["已排除", S.spreadExcluded + " 項",
       `價格散布超過 ${R.spreadCap} 倍，疑似同名不同品（全表仍查得到）`],
    ]) {
      const t = el("div", "tile");
      t.append(el("div", "label", label), el("div", "value", value),
               el("div", "delta", extra));
      tiles.append(t);
    }
    card.append(tiles);

    const COLS = 7;
    const toSeller = wrap => wrap.querySelectorAll("button.pseller").forEach(b => {
      b.addEventListener("click", () => { P.set("seller", b.dataset.s); show("seller"); });
    });
    const sellerCell = p =>
      `<td><button class="linkish pseller" data-s="${esc(p.seller)}">${esc(p.seller)}</button></td>`;
    const lastCell = p => `<td${p.stale ? ' class="off"' : ""}>${p.last}` +
      (p.stale ? `（${p.daysSince} 天沒買了）` : "") + "</td>";

    // 漲價清單
    const risen = pairs.filter(p => p.risen);
    const rc = el("div", "scrollx");
    rc.id = "prisen";
    rc.innerHTML = `<h2 style="margin-top:14px">漲價清單（${risen.length}）</h2>`;
    if (!risen.length) {
      rc.append(el("div", "note", "目前沒有偵測到漲價。"));
    } else {
      const t = el("div");
      t.innerHTML = "<div class=\"desc\">點列展開單價時間線</div>" +
        "<table><tr><th>品名</th><th>店家</th><th class=\"num\">先前</th>" +
        "<th class=\"num\">最近</th><th class=\"num\">漲幅</th>" +
        "<th class=\"num\">價格點</th><th>上次購買</th></tr>" +
        risen.map((p, i) =>
          `<tr class="inv" data-i="${i}"><td>${esc(p.desc)}</td>` +
          sellerCell(p) +
          `<td class="num">${pmoney(p.base)}</td>` +
          `<td class="num">${pmoney(p.latest)}</td>` +
          `<td class="num">+${p.pct}%</td>` +
          `<td class="num">${p.n}</td>` + lastCell(p) + "</tr>").join("") +
        "</table>";
      t.querySelectorAll("tr.inv").forEach(tr => {
        tr.addEventListener("click", evt => {
          if (evt.target.closest("button")) return;
          togglePoints(tr, risen[+tr.dataset.i], COLS);
        });
      });
      toSeller(t);
      rc.append(t);
    }
    if (S.spreadExcluded)
      rc.append(el("div", "note",
        `已排除 ${S.spreadExcluded} 項：同店同品名但價格散布超過 ${R.spreadCap} 倍，` +
        "疑似同名不同品（例如規格不同卻共用一個品名）。它們仍列在下方全表。"));
    card.append(rc);

    // 全表
    const ft = el("div");
    ft.id = "pall";
    ft.innerHTML = `<h2 style="margin-top:18px">全部可追蹤品項（${pairs.length}）</h2>`;
    const ff = el("div", "filters");
    ff.innerHTML = '<input type="search" id="pq" placeholder="品名或店家">';
    const fstat = el("div", "stat");
    const fwrap = el("div", "scrollx");
    ft.append(ff, fstat, fwrap);
    card.append(ft);
    body.append(card);

    const pq = ff.querySelector("#pq");
    function paintFull() {
      const q = pq.value.trim().toLowerCase();
      const rows = q
        ? pairs.filter(p => (p.desc + "\n" + p.seller).toLowerCase().includes(q))
        : pairs;
      fstat.textContent = `${rows.length} 項`
        + (q ? `（全部 ${pairs.length} 項）` : "");
      fwrap.innerHTML = "<table><tr><th>品名</th><th>店家</th>" +
        "<th class=\"num\">價格點</th><th class=\"num\">最低</th>" +
        "<th class=\"num\">最高</th><th>上次購買</th><th>狀態</th></tr>" +
        rows.map((p, i) =>
          `<tr class="inv" data-i="${i}"><td>${esc(p.desc)}</td>` +
          sellerCell(p) +
          `<td class="num" title="${p.spanDays} 天內">${p.n}</td>` +
          `<td class="num">${pmoney(p.min)}</td>` +
          `<td class="num">${pmoney(p.max)}</td>` + lastCell(p) +
          // 漲價不套 .ok——那是 --up-good（綠），會讀成「漲價是好事」。
          // 有事的用一般色、沒事的靜音，層次夠了也不必再發明一個色票
          (p.risen ? `<td>漲價 +${p.pct}%</td>`
            : `<td class="off">${p.spreadFlagged ? `散布 ${p.spread} 倍`
              : p.max === p.min ? "持平" : "有波動"}</td>`) +
          "</tr>").join("") + "</table>";
      fwrap.querySelectorAll("tr.inv").forEach(tr => {
        tr.addEventListener("click", evt => {
          if (evt.target.closest("button")) return;
          togglePoints(tr, rows[+tr.dataset.i], COLS);
        });
      });
      toSeller(fwrap);
    }
    pq.addEventListener("input", paintFull);
    paintFull();
  }

  // ---- 視圖切換 ---------------------------------------------------------
  function show(view) {
    if (view !== "seller") P.delete("seller");
    for (const b of chips.children)
      b.classList.toggle("on", b.dataset.view === view);
    body.innerHTML = "";
    if (view === "list") listView();
    else if (view === "seller") sellerView();
    else if (view === "price") priceView();
    else fixedView();
    syncUrl(view);
  }
  show(initView);
  },
});
</script>
</body>
</html>
